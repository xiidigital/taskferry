# Taskport development workspace (virtual root — not published).
#
# Every distribution lives under packages/* and is independently buildable and
# releasable. This root only wires the uv workspace and the shared dev tooling.
#
# The dependency direction the layout enforces:
#
#   taskport                    <- no dependencies at all, ever
#     ^-- taskport-procrastinate
#     ^-- taskport-cloudtasks
#     ^-- taskport-cloudrun
#     ^-- taskport-sqs
#     ^-- taskport-servicebus
#     ^-- taskport-dramatiq
#     ^-- taskport-jobs
#     ^-- taskport-django
#     ^-- taskport-events
#     ^-- taskport-scheduler
#
# See docs/architecture/refactor-2026.md and docs/adr/0013-packaging-strategy.md.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
taskport = { workspace = true }
taskport-procrastinate = { workspace = true }
taskport-cloudtasks = { workspace = true }
taskport-cloudrun = { workspace = true }
taskport-celery = { workspace = true }
taskport-dramatiq = { workspace = true }
taskport-servicebus = { workspace = true }
taskport-sqs = { workspace = true }
taskport-jobs = { workspace = true }
taskport-events = { workspace = true }
taskport-scheduler = { workspace = true }
taskport-django = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
    "mypy>=1.13",
    "ruff>=0.8",
    "django>=6.0",
    # For testing the OpenTelemetry bridge (in-memory span exporter).
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    # For building the documentation site.
    "mkdocs-material>=9.5",
    # Workspace members, installed editable for local development/testing.
    "taskport",
    "taskport-procrastinate",
    "taskport-cloudtasks",
    "taskport-cloudrun",
    "taskport-sqs",
    "taskport-servicebus",
    "taskport-dramatiq",
    "taskport-celery",
    "taskport-jobs",
    "taskport-events",
    "taskport-scheduler",
    "taskport-django",
]

# --------------------------------------------------------------------------- #
# Shared tooling configuration. Each package re-uses these conventions; when a
# package is extracted to its own repo it copies the relevant blocks.
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
mypy_path = [
    "packages/taskport/src",
    "packages/taskport-procrastinate/src",
    "packages/taskport-cloudtasks/src",
    "packages/taskport-cloudrun/src",
    "packages/taskport-sqs/src",
    "packages/taskport-servicebus/src",
    "packages/taskport-dramatiq/src",
    "packages/taskport-celery/src",
    "packages/taskport-jobs/src",
    "packages/taskport-events/src",
    "packages/taskport-scheduler/src",
    "packages/taskport-django/src",
]
explicit_package_bases = true
namespace_packages = true

# Type checking covers the shipped code — packages/*/src — at full strictness,
# because that is the contract a user's own type-checker sees after installing a
# distribution. Tests are excluded deliberately:
#
#   * test doubles stand in for SDK objects whose real types are not installed
#     here (boto3, the Azure SDK, the Kubernetes client), so strict generics on a
#     five-line fake produce noise rather than safety;
#   * pytest fixtures and Django's decorators are untyped, and annotating around
#     them would mean a suppression on every use that says nothing;
#   * the suite already establishes that the code runs, which is what tests are
#     for. Ruff still lints them.
exclude = ['packages/[^/]+/tests/']

[[tool.mypy.overrides]]
module = [
    "google.*",
    "boto3.*",
    "botocore.*",
    "azure.*",
    "kubernetes.*",
    "opentelemetry.*",
    "django.*",
    "confluent_kafka.*",
    "procrastinate.*",
    "dramatiq.*",
    "celery.*",
]
ignore_missing_imports = true

# Django ships no py.typed, so its symbols are Any. Relax the two strict checks
# that this forces, on the Django-facing package only.
[[tool.mypy.overrides]]
module = ["taskport_django.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false


[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# importlib import mode lets same-named test files (e.g. test_import_light.py)
# coexist across packages without __init__.py collisions.
addopts = "-ra --import-mode=importlib"
DJANGO_SETTINGS_MODULE = "tests_settings"
pythonpath = [
    "packages/taskport-django/tests",
    "packages/taskport/tests",
]

[tool.coverage.run]
branch = true
source = [
    "taskport",
    "taskport_procrastinate",
    "taskport_cloudtasks",
    "taskport_cloudrun",
    "taskport_sqs",
    "taskport_servicebus",
    "taskport_dramatiq",
    "taskport_celery",
    "taskport_jobs",
    "taskport_events",
    "taskport_scheduler",
    "taskport_django",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
