# Taskferry development workspace (virtual root — not published).
#
# Every distribution lives under packages/* and is independently buildable and
# releasable. This root only wires the uv workspace and the shared dev tooling.
#
# The dependency direction the layout enforces:
#
#   taskferry                    <- no dependencies at all, ever
#     ^-- taskferry-procrastinate
#     ^-- taskferry-cloudtasks
#     ^-- taskferry-cloudrun
#     ^-- taskferry-sqs
#     ^-- taskferry-servicebus
#     ^-- taskferry-dramatiq
#     ^-- taskferry-jobs
#     ^-- taskferry-django
#     ^-- taskferry-events
#     ^-- taskferry-scheduler
#
# See docs/architecture/refactor-2026.md and docs/adr/0013-packaging-strategy.md.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
taskferry = { workspace = true }
taskferry-procrastinate = { workspace = true }
taskferry-cloudtasks = { workspace = true }
taskferry-cloudrun = { workspace = true }
taskferry-celery = { workspace = true }
taskferry-otel = { workspace = true }
taskferry-dramatiq = { workspace = true }
taskferry-servicebus = { workspace = true }
taskferry-sqs = { workspace = true }
taskferry-jobs = { workspace = true }
taskferry-events = { workspace = true }
taskferry-scheduler = { workspace = true }
taskferry-django = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
    "mypy>=1.13",
    "ruff>=0.8",
    "django>=6.0",
    # For testing the OpenTelemetry bridge (in-memory span exporter).
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    # For building the documentation site.
    "mkdocs-material>=9.5",
    # Workspace members, installed editable for local development/testing.
    "taskferry",
    "taskferry-procrastinate",
    "taskferry-cloudtasks",
    "taskferry-cloudrun",
    "taskferry-sqs",
    "taskferry-servicebus",
    "taskferry-dramatiq",
    "taskferry-celery",
    "taskferry-otel",
    "taskferry-jobs",
    "taskferry-events",
    "taskferry-scheduler",
    "taskferry-django",
]

# --------------------------------------------------------------------------- #
# Shared tooling configuration. Each package re-uses these conventions; when a
# package is extracted to its own repo it copies the relevant blocks.
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
mypy_path = [
    "packages/taskferry/src",
    "packages/taskferry-procrastinate/src",
    "packages/taskferry-cloudtasks/src",
    "packages/taskferry-cloudrun/src",
    "packages/taskferry-sqs/src",
    "packages/taskferry-servicebus/src",
    "packages/taskferry-dramatiq/src",
    "packages/taskferry-celery/src",
    "packages/taskferry-otel/src",
    "packages/taskferry-jobs/src",
    "packages/taskferry-events/src",
    "packages/taskferry-scheduler/src",
    "packages/taskferry-django/src",
]
explicit_package_bases = true
namespace_packages = true

# Type checking covers the shipped code — packages/*/src — at full strictness,
# because that is the contract a user's own type-checker sees after installing a
# distribution. Tests are excluded deliberately:
#
#   * test doubles stand in for SDK objects whose real types are not installed
#     here (boto3, the Azure SDK, the Kubernetes client), so strict generics on a
#     five-line fake produce noise rather than safety;
#   * pytest fixtures and Django's decorators are untyped, and annotating around
#     them would mean a suppression on every use that says nothing;
#   * the suite already establishes that the code runs, which is what tests are
#     for. Ruff still lints them.
exclude = ['packages/[^/]+/tests/']

[[tool.mypy.overrides]]
module = [
    "google.*",
    "boto3.*",
    "botocore.*",
    "azure.*",
    "kubernetes.*",
    "opentelemetry.*",
    "django.*",
    "confluent_kafka.*",
    "procrastinate.*",
    "dramatiq.*",
    "celery.*",
]
ignore_missing_imports = true

# Django ships no py.typed, so its symbols are Any. Relax the two strict checks
# that this forces, on the Django-facing package only.
[[tool.mypy.overrides]]
module = ["taskferry_django.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false


[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# importlib import mode lets same-named test files (e.g. test_import_light.py)
# coexist across packages without __init__.py collisions.
addopts = "-ra --import-mode=importlib"
DJANGO_SETTINGS_MODULE = "tests_settings"
pythonpath = [
    "packages/taskferry-django/tests",
    "packages/taskferry/tests",
]

[tool.coverage.run]
branch = true
source = [
    "taskferry",
    "taskferry_procrastinate",
    "taskferry_cloudtasks",
    "taskferry_cloudrun",
    "taskferry_sqs",
    "taskferry_servicebus",
    "taskferry_dramatiq",
    "taskferry_celery",
    "taskferry_otel",
    "taskferry_jobs",
    "taskferry_events",
    "taskferry_scheduler",
    "taskferry_django",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
