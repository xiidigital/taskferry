[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-servicebus"
version = "0.2.0"
description = "Azure Service Bus task backend for Taskport — pull-based tasks with scheduling."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "azure", "service-bus", "tasks", "queue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["taskport>=0.2,<0.3"]

[project.optional-dependencies]
azure = ["azure-servicebus>=7.12", "azure-identity>=1.17"]

[project.entry-points."taskport.backends"]
servicebus = "taskport_servicebus:make_backend"

[project.urls]
Homepage = "https://github.com/taskport/taskport-servicebus"
Documentation = "https://taskport.dev"
Source = "https://github.com/taskport/taskport-servicebus"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport_servicebus"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
