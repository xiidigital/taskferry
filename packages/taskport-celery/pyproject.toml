[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-celery"
version = "0.1.0"
description = "Celery task backend for Taskport — enqueue Taskport tasks onto a Celery app."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "celery", "tasks", "queue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["taskport>=0.2,<0.3"]

[project.optional-dependencies]
celery = ["celery>=5.3"]

[project.entry-points."taskport.backends"]
celery = "taskport_celery:make_backend"

[project.urls]
Homepage = "https://github.com/taskport/taskport-celery"
Documentation = "https://taskport.dev"
Source = "https://github.com/taskport/taskport-celery"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport_celery"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
