[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-scheduler"
version = "0.2.0"
description = "Portable schedule triggering (cron, rate, one-shot) alongside Taskport."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "scheduler", "cron", "cloud-scheduler", "eventbridge-scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["taskport>=0.2,<0.3"]

[project.optional-dependencies]
gcp = ["google-cloud-scheduler>=2.13"]
aws = ["boto3>=1.34"]
kubernetes = ["kubernetes>=29.0"]

[project.urls]
Homepage = "https://github.com/taskport/taskport-scheduler"
Documentation = "https://taskport.dev/scheduler"
Source = "https://github.com/taskport/taskport-scheduler"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport_scheduler"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
