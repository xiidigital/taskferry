[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-scheduler"
version = "0.1.0"
description = "Portable 'when to fire' triggering across local, GCP Cloud Scheduler, AWS EventBridge Scheduler and more."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "scheduler", "cron", "cloud-scheduler", "eventbridge-scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["taskport-core>=0.1,<0.2"]

[project.optional-dependencies]
gcp = ["google-cloud-scheduler>=2.13"]
aws = ["boto3>=1.34"]
azure = ["azure-mgmt-logic>=10.0", "azure-identity>=1.17"]
kubernetes = ["kubernetes>=30.1"]
otel = ["taskport-core[otel]"]

[project.urls]
Homepage = "https://github.com/taskport/taskport-scheduler"
Documentation = "https://taskport.dev/scheduler"
Source = "https://github.com/taskport/taskport-scheduler"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
