[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-django"
version = "0.1.0"
description = "Portable backends for the official Django 6 Tasks framework: local, GCP Cloud Tasks, AWS SQS and more."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "django", "django-tasks", "cloud-tasks", "sqs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "taskport-core>=0.1,<0.2",
    "django>=6.0",
]

[project.optional-dependencies]
postgres = ["procrastinate>=3.0"]
redis = ["dramatiq[redis]>=1.17"]
gcp = ["google-cloud-tasks>=2.16"]
aws = ["boto3>=1.34"]
azure = ["azure-servicebus>=7.12", "azure-identity>=1.17"]
otel = ["taskport-core[otel]"]

[project.urls]
Homepage = "https://github.com/taskport/taskport-django"
Documentation = "https://taskport.dev/django"
Source = "https://github.com/taskport/taskport-django"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
