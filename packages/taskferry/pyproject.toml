[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskferry"
version = "0.2.0"
description = "A portable execution layer for Python — inline, tasks and jobs on the engines you already run."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskferry authors" }]
keywords = [
    "taskferry",
    "execution",
    "tasks",
    "jobs",
    "portability",
    "ports-and-adapters",
    "capabilities",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

# Intentionally empty, and enforced by packages/taskferry/tests/test_architecture.py.
# Installing taskferry must never pull in Django, Procrastinate, psycopg, Redis,
# Celery, a cloud SDK or a Kubernetes client. Adapters are separate distributions.
dependencies = []

# No optional dependencies: the OpenTelemetry bridge now lives in its own
# distribution, `taskferry-otel`, so `taskferry` declares nothing beyond itself.
# The bridge code stays importable at `taskferry.core.otel` and imports
# opentelemetry lazily, so the core carries no dependency, required or optional.

[project.scripts]
taskferry = "taskferry.cli:main"

[project.urls]
Homepage = "https://github.com/taskferry/taskferry"
Documentation = "https://taskferry.dev"
Source = "https://github.com/taskferry/taskferry"
Changelog = "https://github.com/taskferry/taskferry/blob/main/packages/taskferry/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/taskferry"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
