[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskferry-sqs"
version = "0.3.0"
description = "AWS SQS task backend for Taskferry — pull-based task delivery."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskferry authors" }]
keywords = ["taskferry", "aws", "sqs", "tasks", "queue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["taskferry>=0.2,<0.3"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
aws-async = ["aiobotocore>=2.13"]

[project.entry-points."taskferry.backends"]
sqs = "taskferry_sqs:make_backend"

[project.urls]
Homepage = "https://github.com/xiidigital/taskferry"
Documentation = "https://taskferry.dev"
Source = "https://github.com/xiidigital/taskferry"

[tool.hatch.build.targets.wheel]
packages = ["src/taskferry_sqs"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
