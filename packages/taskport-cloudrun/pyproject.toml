[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-cloudrun"
version = "0.2.0"
description = "Google Cloud Run Jobs backend for Taskport — serverless batch workloads."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "gcp", "cloud-run", "jobs", "batch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["taskport>=0.2,<0.3"]

[project.optional-dependencies]
gcp = ["google-cloud-run>=0.10"]

[project.entry-points."taskport.backends"]
cloudrun = "taskport_cloudrun:make_backend"

[project.urls]
Homepage = "https://github.com/taskport/taskport-cloudrun"
Documentation = "https://taskport.dev"
Source = "https://github.com/taskport/taskport-cloudrun"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport_cloudrun"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
