[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskferry-django"
version = "0.2.0"
description = "Django integration for Taskferry — a django.tasks backend, settings, checks and CLI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskferry authors" }]
keywords = ["taskferry", "django", "django-tasks", "cloud-tasks", "sqs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["taskferry>=0.2,<0.3", "django>=5.1"]

[project.urls]
Homepage = "https://github.com/xiidigital/taskferry"
Documentation = "https://taskferry.dev/django"
Source = "https://github.com/xiidigital/taskferry"

[tool.hatch.build.targets.wheel]
packages = ["src/taskferry_django"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
