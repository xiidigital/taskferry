[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-procrastinate"
version = "0.2.0"
description = "Procrastinate task backend for Taskport — PostgreSQL-backed task execution."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "procrastinate", "postgresql", "tasks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["taskport>=0.2,<0.3"]

[project.optional-dependencies]
procrastinate = ["procrastinate>=2.0"]

[project.entry-points."taskport.backends"]
procrastinate = "taskport_procrastinate:make_backend"

[project.urls]
Homepage = "https://github.com/taskport/taskport-procrastinate"
Documentation = "https://taskport.dev"
Source = "https://github.com/taskport/taskport-procrastinate"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport_procrastinate"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
