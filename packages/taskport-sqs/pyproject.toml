[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-sqs"
version = "0.2.0"
description = "AWS SQS task backend for Taskport — pull-based task delivery."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "aws", "sqs", "tasks", "queue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["taskport>=0.2,<0.3"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.entry-points."taskport.backends"]
sqs = "taskport_sqs:make_backend"

[project.urls]
Homepage = "https://github.com/taskport/taskport-sqs"
Documentation = "https://taskport.dev"
Source = "https://github.com/taskport/taskport-sqs"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport_sqs"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
