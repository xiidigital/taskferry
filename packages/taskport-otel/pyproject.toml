[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-otel"
version = "0.1.0"
description = "OpenTelemetry bridge for Taskport — turn taskport.* spans into real OTel spans."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "opentelemetry", "otel", "tracing", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "taskport>=0.2,<0.3",
    "opentelemetry-api>=1.27",
]

[project.urls]
Homepage = "https://github.com/taskport/taskport-otel"
Documentation = "https://taskport.dev"
Source = "https://github.com/taskport/taskport-otel"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport_otel"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
