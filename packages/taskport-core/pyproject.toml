[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-core"
version = "0.1.0"
description = "Tiny shared substrate for the Taskport family of portable execution primitives."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "ports-and-adapters", "portability", "capabilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.27"]

[project.urls]
Homepage = "https://github.com/taskport/taskport-core"
Documentation = "https://taskport.dev"
Source = "https://github.com/taskport/taskport-core"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
