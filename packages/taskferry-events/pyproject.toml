[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskferry-events"
version = "0.2.0"
description = "Portable pub/sub and fan-out event delivery, alongside Taskferry."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskferry authors" }]
keywords = ["taskferry", "events", "pubsub", "cloudevents", "eventbridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["taskferry>=0.2,<0.3"]

[project.optional-dependencies]
gcp = ["google-cloud-pubsub>=2.21"]
aws = ["boto3>=1.34"]
azure = ["azure-identity>=1.17", "azure-eventgrid>=4.20"]
kafka = ["confluent-kafka>=2.4"]

[project.urls]
Homepage = "https://github.com/taskferry/taskferry-events"
Documentation = "https://taskferry.dev/events"
Source = "https://github.com/taskferry/taskferry-events"

[tool.hatch.build.targets.wheel]
packages = ["src/taskferry_events"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
