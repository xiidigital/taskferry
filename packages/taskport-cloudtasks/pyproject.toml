[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-cloudtasks"
version = "0.2.0"
description = "Google Cloud Tasks backend for Taskport — push-based serverless tasks."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "gcp", "cloud-tasks", "tasks", "serverless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["taskport>=0.2,<0.3"]

[project.optional-dependencies]
gcp = ["google-cloud-tasks>=2.16"]

[project.entry-points."taskport.backends"]
cloudtasks = "taskport_cloudtasks:make_backend"

[project.urls]
Homepage = "https://github.com/taskport/taskport-cloudtasks"
Documentation = "https://taskport.dev"
Source = "https://github.com/taskport/taskport-cloudtasks"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport_cloudtasks"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
