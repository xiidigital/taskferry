[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-jobs"
version = "0.1.0"
description = "Portable execution of finite workloads (ETL, GIS, ML, batch) across local, GCP, AWS, Azure and Kubernetes."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "jobs", "batch", "cloud-run", "aws-batch", "kubernetes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["taskport-core>=0.1,<0.2"]

[project.optional-dependencies]
gcp = ["google-cloud-run>=0.10"]
aws = ["boto3>=1.34"]
azure = ["azure-mgmt-appcontainers>=3.0", "azure-identity>=1.17"]
kubernetes = ["kubernetes>=30.1"]
otel = ["taskport-core[otel]"]

[project.urls]
Homepage = "https://github.com/taskport/taskport-jobs"
Documentation = "https://taskport.dev/jobs"
Source = "https://github.com/taskport/taskport-jobs"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
