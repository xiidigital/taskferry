[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskferry-servicebus"
version = "0.3.0"
description = "Azure Service Bus task backend for Taskferry — pull-based tasks with scheduling."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskferry authors" }]
keywords = ["taskferry", "azure", "service-bus", "tasks", "queue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["taskferry>=0.2,<0.3"]

[project.optional-dependencies]
azure = ["azure-servicebus>=7.12", "azure-identity>=1.17"]

[project.entry-points."taskferry.backends"]
servicebus = "taskferry_servicebus:make_backend"

[project.urls]
Homepage = "https://github.com/xiidigital/taskferry"
Documentation = "https://taskferry.dev"
Source = "https://github.com/xiidigital/taskferry"

[tool.hatch.build.targets.wheel]
packages = ["src/taskferry_servicebus"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
