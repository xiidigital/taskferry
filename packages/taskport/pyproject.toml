[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport"
version = "0.2.0"
description = "A portable execution layer for Python — inline, tasks and jobs on the engines you already run."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = [
    "taskport",
    "execution",
    "tasks",
    "jobs",
    "portability",
    "ports-and-adapters",
    "capabilities",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

# Intentionally empty, and enforced by packages/taskport/tests/test_architecture.py.
# Installing taskport must never pull in Django, Procrastinate, psycopg, Redis,
# Celery, a cloud SDK or a Kubernetes client. Adapters are separate distributions.
dependencies = []

# No optional dependencies: the OpenTelemetry bridge now lives in its own
# distribution, `taskport-otel`, so `taskport` declares nothing beyond itself.
# The bridge code stays importable at `taskport.core.otel` and imports
# opentelemetry lazily, so the core carries no dependency, required or optional.

[project.scripts]
taskport = "taskport.cli:main"

[project.urls]
Homepage = "https://github.com/taskport/taskport"
Documentation = "https://taskport.dev"
Source = "https://github.com/taskport/taskport"
Changelog = "https://github.com/taskport/taskport/blob/main/packages/taskport/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
