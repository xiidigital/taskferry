[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskport-events"
version = "0.1.0"
description = "Portable pub/sub and fan-out event delivery (CloudEvents-inspired) across in-memory, GCP Pub/Sub and more."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taskport authors" }]
keywords = ["taskport", "events", "pubsub", "cloudevents", "eventbridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["taskport-core>=0.1,<0.2"]

[project.optional-dependencies]
gcp = ["google-cloud-pubsub>=2.23"]
aws = ["boto3>=1.34"]
azure = ["azure-eventgrid>=4.20", "azure-identity>=1.17"]
kafka = ["confluent-kafka>=2.5"]
otel = ["taskport-core[otel]"]

[project.urls]
Homepage = "https://github.com/taskport/taskport-events"
Documentation = "https://taskport.dev/events"
Source = "https://github.com/taskport/taskport-events"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]
