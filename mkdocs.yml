site_name: Taskferry
site_description: A portable execution layer for Python — inline, tasks and jobs on the engines you already run.
site_url: https://taskferry.dev
repo_url: https://github.com/taskferry/taskferry
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: README.md
  - Architecture:
      - Overview: architecture/overview.md
      - The 2026 refactor: architecture/refactor-2026.md
      - Async, threads and processes: concurrency.md
      - Security: security.md
  - Migration:
      - 0.1 to 0.2: migration/0.1-to-0.2.md
  - Engineering:
      - Coding standards: engineering/coding-standards.md
      - Testing: engineering/testing.md
      - Adding an adapter: engineering/adding-an-adapter.md
      - Release process: engineering/release.md
      - CI: engineering/ci.md
  - Decisions (ADRs):
      - Index & history: adr/README.md
      - Foundations:
          - 0001 · Portable execution layer: adr/0001-portable-execution-layer.md
          - 0002 · Not a task queue: adr/0002-not-a-task-queue.md
          - 0003 · Task and Job: adr/0003-task-and-job.md
          - 0004 · Core scope: adr/0004-core-scope.md
      - The model:
          - 0005 · Capability model: adr/0005-capability-model.md
          - 0006 · Framework adapters: adr/0006-framework-adapters.md
          - 0007 · Configuration: adr/0007-configuration.md
          - 0008 · Provider credentials: adr/0008-provider-credentials.md
      - Semantics:
          - 0009 · Serialization: adr/0009-serialization.md
          - 0010 · Delivery semantics: adr/0010-delivery-semantics.md
          - 0011 · Retry ownership: adr/0011-retry-ownership.md
          - 0012 · Observability: adr/0012-observability.md
      - Packaging & delivery:
