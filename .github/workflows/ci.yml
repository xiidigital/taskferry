name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --python ${{ matrix.python-version }}

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict, all packages)
        run: >
          uv run mypy
          packages/taskport-core/src
          packages/taskport-jobs/src
          packages/taskport-events/src
          packages/taskport-scheduler/src
          packages/taskport-django/src

      - name: Pytest (+ coverage)
        run: uv run pytest --cov=taskport --cov-report=term-missing

  build:
    name: build distributions
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build every package (wheel + sdist)
        run: uv run python tooling/build_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
