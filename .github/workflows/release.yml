name: Release

# Publishes ONE distribution to PyPI when a per-package tag is pushed, e.g.
#   taskferry-v0.2.0            -> publishes the `taskferry` distribution
#   taskferry-celery-v0.1.0     -> publishes `taskferry-celery`
#
# Uses PyPI Trusted Publishing (OIDC): no API tokens are stored anywhere. Each
# PyPI project must have a Trusted Publisher configured for this repo pointing at
# workflow `release.yml` (see docs/engineering/release.md).

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release tags are accepted only when their commit is reachable from
          # main. Fetch history so a tag created on an unmerged feature branch
          # cannot publish a distribution.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Require the tagged commit to be merged into main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Refusing to publish: tag commit is not in main history."
            exit 1
          fi
      - name: Derive and validate the package version from the tag
        id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          package="${tag%-v*}"        # strip the trailing -v<version>
          version="${tag##*-v}"
          if [ ! -d "packages/${package}" ]; then
            echo "::error::tag '${tag}' -> unknown package 'packages/${package}'"
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${tag}' must end in a semantic version (X.Y.Z)."
            exit 1
          fi
          project_version="$(python - "${package}" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          project_file = Path("packages") / sys.argv[1] / "pyproject.toml"
          with project_file.open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )"
          if [ "${version}" != "${project_version}" ]; then
            echo "::error::tag '${tag}' requests ${version}, but ${package}/pyproject.toml declares ${project_version}."
            exit 1
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "package_version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${package} ${version} from tag ${tag}"
      - name: Build the tagged distribution only
        run: uv build --package "${{ steps.parse.outputs.package }}" --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A GitHub Environment named after the distribution. It makes each PyPI
    # Trusted Publisher's claim set unique (owner+repo+workflow+environment), so
    # every package in this monorepo can register its own publisher — PyPI
    # forbids two *pending* publishers that share an identical configuration.
    # GitHub creates the environment on first use; no manual setup needed.
    environment: ${{ needs.build.outputs.package }}
    permissions:
      id-token: write   # required for OIDC Trusted Publishing; no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
